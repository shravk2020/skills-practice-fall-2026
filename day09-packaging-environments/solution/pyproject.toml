[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-cli-lab"
version = "0.1.0"
description = "A tiny CLI that counts notes in a text file."
requires-python = ">=3.10"

[project.scripts]
notes = "notes_cli:main"

[tool.setuptools]
py-modules = ["notes_cli"]
